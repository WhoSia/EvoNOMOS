name: EvoNOMOS DIP-69 WC5R1 curl replay

on:
  push:
    branches:
      - agent/evonomos-dip69-wc5-groq-parity
    paths:
      - .github/workflows/evonomos-dip69-wc5r1-world-contact.yml

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Seal exact replay prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}" || { echo MISSING_GROQ_API_KEY; exit 78; }
          python3 -m py_compile experiments/dip69_wc5/run_wc5.py experiments/dip69_wc5/run_wc5r1.py
          curl --version | head -1
          echo WC5R1_EXACT_REPLAY_ENVELOPE_PASS
      - name: Execute exact 96-identity curl replay
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/dip69_wc5/run_wc5r1.py
      - name: Upload sealed replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dip69-wc5r1-results
          path: wc5_output/
          if-no-files-found: warn
          retention-days: 90
