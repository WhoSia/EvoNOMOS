name: P44 Actual Go Source Architecture and Compositional Authority Mathematics

on:
  push:
    branches:
      - research/law-r1-p44-r3-stateful-alias-court
    paths:
      - 'active/g8-law-r1-p44/structural_law_return/decision_sufficient_boundaries/**'
      - '.github/workflows/p44-compositional-authority-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-backed-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original 2026 October P35-P7 source blobs
        run: |
          test "$(git hash-object tools/p35-p7/arms/live/route_headers.go)" = ad9a2fbc0a30a39475f746068e74e2d3e6c93999
          test "$(git hash-object tools/p35-p7/arms/snapshot/route_headers.go)" = e9ca2c3863d5aa06ef0f0b9d168ddcf184713d75
      - name: Compile Go AST inspector and extract actual bounded source facts
        run: |
          go build -o /tmp/evonomos-source-ast active/g8-law-r1-p44/structural_law_return/decision_sufficient_boundaries/source_ast.go
          /tmp/evonomos-source-ast tools/p35-p7/arms/live/route_headers.go tools/p35-p7/arms/snapshot/route_headers.go | tee /tmp/evonomos-ast-source.json
          python -c 'import json; d=json.load(open("/tmp/evonomos-ast-source.json")); assert d["identical_pattern_constructor_ast"]; assert d["live"]["closure_reads_registry"] and not d["snapshot"]["closure_reads_registry"]'
      - name: Test exact product law and adversarial coupling counterexamples
        working-directory: active/g8-law-r1-p44/structural_law_return/decision_sufficient_boundaries
        run: |
          python -m unittest -v test_compositional_authority
          python -m unittest -v test_decision_conflict test_short_witness_dp
      - name: Preserve source witness without repository commit
        uses: actions/upload-artifact@v4
        with:
          name: p44-real-source-ast-structure
          path: /tmp/evonomos-ast-source.json
