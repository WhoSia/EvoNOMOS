name: G8 LAW-R1-P35 P4B Prospective Two-Demand Chi Lifecycle Court

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/p35-p4b/arms/**'
      - 'tools/p35-p4b/audit.py'
      - 'tools/p35-p4b/run_native_chi.sh'
      - '.github/workflows/g8-law-r1-p35-p4b-chi-lifecycle.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: g8-law-r1-p35-p4b-lifecycle
  cancel-in-progress: false

jobs:
  native-two-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Read Frozen Original Chi Source
        uses: actions/checkout@v4
        with:
          repository: go-chi/chi
          ref: 67be7d9cafdaeb4e04e887ff78d09e030ee43b00
          path: chi
          fetch-depth: 1
      - name: Test D4 Inheritance, D5 Negatives, Two Native Repairs and Source Costs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/p35-p4b/run_native_chi.sh
      - name: Preserve Read-Only Native and Source-Rival Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-law-r1-p35-p4b-chi-prospective-two-demand
          path: out/p35-p4b/
          if-no-files-found: warn
          retention-days: 30
