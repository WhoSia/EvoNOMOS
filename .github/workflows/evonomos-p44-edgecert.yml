name: EvoNOMOS P44 Edge-local Repair Simulation Court

on:
  push:
    branches:
      - 'research/law-r1-p44-r3-*'
    paths:
      - 'active/g8-law-r1-p44/formalization/edgecert/**'
      - '.github/workflows/evonomos-p44-edgecert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-conditional-source-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/formalization/edgecert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: "Finite edge-local certificate and omission countermodels"
        run: |
          go version
          go test -count=1 -v ./...
          go vet ./...
          go test -count=1 -race ./...
