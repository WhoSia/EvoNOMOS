name: G8 P40 Math-B Lean Independent Boundary Guards
on:
  push:
    branches: [main]
    paths:
      - 'tools/p40-math-b/lean/**'
      - '.github/workflows/g8-p40-math-b-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject extra axiom, admit or proof hole
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)|:= by[[:space:]]*sorry' tools/p40-math-b/lean/*.lean; then
            exit 11
          fi
      - name: Lean 4 compile and independent kernel check
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: tools/p40-math-b/lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'true'
      - name: Scope and exact proof source receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/p40-math-b-lean
          sha256sum tools/p40-math-b/lean/*.lean tools/p40-math-b/lean/lean-toolchain tools/p40-math-b/lean/lakefile.toml >out/p40-math-b-lean/source-sha256.txt
          echo P40_MATH_B_LEAN_CLASSICAL_CONDITIONAL_KERNEL_PASS >out/p40-math-b-lean/verdict.txt
          echo "No Go semantics automatically proved by the Lean declarations." >out/p40-math-b-lean/scope.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p40-math-b-lean-guard-independence-kernel
          path: out/p40-math-b-lean/
          retention-days: 30
