name: G8 P36 O6 Finite Maintenance Automaton Original Chi
on:
  push:
    branches: [main]
    paths:
      - 'tools/p36-o6/**'
      - '.github/workflows/g8-p36-o6-chi-finite-automaton.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-finite-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [ERASE, POSITION_INDEX, RELATIVE_REBASE, STABLE_ORDER]
    env:
      P35_O6_ARM: EAGER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23', cache: false}
      - uses: actions/checkout@v4
        with:
          repository: go-chi/chi
          ref: 67be7d9cafdaeb4e04e887ff78d09e030ee43b00
          path: chi
          fetch-depth: 1
      - name: Original Go source and independent finite 1093 word reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/p36-o6/${{ matrix.variant }}
          test "$(git -C chi rev-parse HEAD)" = 67be7d9cafdaeb4e04e887ff78d09e030ee43b00
          case '${{ matrix.variant }}' in
            ERASE) source_file=tools/p36-o3/arms/chi/erase/p35_epoch_router.go ;;
            POSITION_INDEX) source_file=tools/p36-o3/arms/chi/retain/p35_epoch_router.go ;;
            RELATIVE_REBASE) source_file=tools/p36-o5/arms/chi/relative-rebase/p35_epoch_router.go ;;
            STABLE_ORDER) source_file=tools/p36-o4/arms/chi/stable-order/p35_epoch_router.go ;;
            *) exit 99 ;;
          esac
          cp "$source_file" chi/middleware/p35_epoch_router.go
          cp tools/p35-o6/tests/chi/p35_o6_eager_lazy_test.go chi/middleware/
          cp tools/p36-o3/tests/chi/p36_o3_d14_test.go chi/middleware/
          (cd chi && go vet ./...) >out/p36-o6/${{ matrix.variant }}/vet.log 2>&1 || { cat out/p36-o6/${{ matrix.variant }}/vet.log; exit 11; }
          (cd chi && go test -race -count=1 ./middleware) >out/p36-o6/${{ matrix.variant }}/race.log 2>&1 || { cat out/p36-o6/${{ matrix.variant }}/race.log; exit 12; }
          (cd chi && go test -count=1 ./...) >out/p36-o6/${{ matrix.variant }}/full-original.log 2>&1 || { cat out/p36-o6/${{ matrix.variant }}/full-original.log; exit 13; }
          cp tools/p36-o6/tests/chi/p36_o6_finite_action_reference_test.go chi/middleware/
          set +e
          (cd chi && go test -v -count=1 -run '^TestP36O6ExhaustiveFiniteMaintenanceWords$' ./middleware) >out/p36-o6/${{ matrix.variant }}/finite-1093.log 2>&1
          rc=$?
          set -e
          if [ '${{ matrix.variant }}' = STABLE_ORDER ]; then
            test "$rc" -eq 0 || { cat out/p36-o6/${{ matrix.variant }}/finite-1093.log; exit 21; }
            grep -q 'P36_O6_ORIGINAL_GO_FINITE_1093_WORDS_ALL_PREFIXES_PASS' out/p36-o6/${{ matrix.variant }}/finite-1093.log
            echo P36_O6_STABLE_ORDER_ALL_1093_FINITE_PREFIXES_PASS >out/p36-o6/${{ matrix.variant }}/verdict.txt
          else
            test "$rc" -ne 0 || { cat out/p36-o6/${{ matrix.variant }}/finite-1093.log; echo UNEXPECTED_1093_ALL_PASS; exit 22; }
            grep -q 'P36_O6_TRACE_MODEL_DIVERGENCE' out/p36-o6/${{ matrix.variant }}/finite-1093.log || { cat out/p36-o6/${{ matrix.variant }}/finite-1093.log; exit 23; }
            echo P36_O6_${{ matrix.variant }}_FINITE_ORACLE_EXPECTED_NEGATIVE >out/p36-o6/${{ matrix.variant }}/verdict.txt
          fi
          sha256sum "$source_file" tools/p36-o6/tests/chi/p36_o6_finite_action_reference_test.go >out/p36-o6/${{ matrix.variant }}/sources.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p36-o6-${{ matrix.variant }}-chi-exhaustive
          path: out/p36-o6/${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 30
