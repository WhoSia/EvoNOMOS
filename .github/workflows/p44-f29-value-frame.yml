name: P44 F29 Value Frame Source Certificate
on:
  push:
    branches:
      - research/law-r1-p44-r3-stateful-alias-court
    paths:
      - 'active/g8-law-r1-p44/formalization/f29_value_frame/**'
      - '.github/workflows/p44-f29-value-frame.yml'
  pull_request:
    paths:
      - 'active/g8-law-r1-p44/formalization/f29_value_frame/**'
      - '.github/workflows/p44-f29-value-frame.yml'
permissions:
  contents: read
jobs:
  source-frame:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/formalization/f29_value_frame
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Verify AST closure, source mutations and safety countermodels
        run: |
          set -euo pipefail
          go version
          gofmt -l sourcecert/ fixture/
          go test -count=1 -v ./...
          go vet ./...
          go test -race -count=1 ./...
