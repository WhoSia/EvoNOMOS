name: P44 F32 Refinement Lift and Jones Court
on:
  push:
    branches:
      - research/law-r1-p44-r3-stateful-alias-court
    paths:
      - 'active/g8-law-r1-p44/formalization/f32_refinement_lift/**'
      - '.github/workflows/p44-f32-refinement-lift.yml'
  pull_request:
    paths:
      - 'active/g8-law-r1-p44/formalization/f32_refinement_lift/**'
      - '.github/workflows/p44-f32-refinement-lift.yml'
permissions:
  contents: read
jobs:
  finite-refinement-court:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/formalization/f32_refinement_lift
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Reproduce exact Jones countermodel and entire finite lift court
        run: |
          set -euo pipefail
          go version
          go test -count=1 -v ./...
          go vet ./...
          go test -race -count=1 ./...
