name: EvoNOMOS Paper B v18 bilingual evidence audit
on:
  push:
    branches:
      - research/law-r1-p44-r3-stateful-alias-court
    paths:
      - 'active/g8-law-r1-p44/structural_law_return/prospective_cohort_20261111/paper_b/PAPER_B_BILINGUAL_INTEGRATED_18_20261121.md'
      - 'active/g8-law-r1-p44/structural_law_return/prospective_cohort_20261111/paper_b/audit_paper_b_v18.py'
      - 'active/g8-law-r1-p44/structural_law_return/prospective_cohort_20261111/paper_b/test_audit_paper_b_v18.py'
      - '.github/workflows/paper-b-v18-bilingual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-paper-b-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source and regression sensitivity
        working-directory: active/g8-law-r1-p44/structural_law_return/prospective_cohort_20261111/paper_b
        run: |
          python -m py_compile audit_paper_b_v18.py test_audit_paper_b_v18.py
          python audit_paper_b_v18.py
          python -m unittest -v test_audit_paper_b_v18.py
