name: G8 LAW-R1-P15 Minimal Context-Basis Court

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/law-r1-p15-*'
      - 'active/g8-law-r1-p15/**'
      - 'lawkit/protocol/v0.19/**'
      - '.github/workflows/g8-law-r1-p15-minimal-basis.yml'

permissions:
  contents: read

jobs:
  minimal-basis:
    name: P15 Minimal Context-Basis Court
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EvoNOMOS
        uses: actions/checkout@v4
      - name: Prepare P15 Output
        run: mkdir -p out-p15
      - name: Verify P15 Replication and Basis Attacks
        run: python3 tools/law-r1-p15-basis.py
      - name: Run P15 Minimal Context-Basis Court
        run: node tools/law-r1-p15-court.mjs out-p15/p15-basis.json out-p15/p15-court.json
      - name: Upload P15 Minimal Context-Basis Artifact
        uses: actions/upload-artifact@v4
        with:
          name: g8-law-r1-p15-minimal-basis
          path: out-p15/
          retention-days: 30
