name: G8 P11-P1 Rival Constitution Preseal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'active/g8-origin-r1-p11-p1/**'
      - 'lawkit/oracles/provider-surface-v01/**'
      - 'tools/p11-p1-preseal-verify.mjs'
      - 'tools/p11-p1-exposure-verify.mjs'
      - '.github/workflows/g8-p11-p1-preseal.yml'

concurrency:
  group: g8-p11-p1-preseal
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TRUEFORGE_REPO: https://github.com/truefoundry/trueforge.git
  TRUEFORGE_BASE: dd421b79216c9b42eefd7b0191e546919f8be3f1
  ACTIVE: active/g8-origin-r1-p11-p1

jobs:
  preseal:
    name: Constitution, exact-source and independent-oracle preseal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen constitutions and zero treatment bytes
        run: |
          set -euo pipefail
          node tools/p11-p1-preseal-verify.mjs "$ACTIVE"
          test ! -e "$ACTIVE/arms"
          test ! -e "$ACTIVE/materialized"
          test ! -e "$ACTIVE/treatments"
          echo CONSTITUTION_OK

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'

      - name: Validate independent Go provider-surface oracle
        run: |
          set -euo pipefail
          test -z "$(gofmt -l lawkit/oracles/provider-surface-v01)"
          go test ./lawkit/oracles/provider-surface-v01
          mkdir -p out
          go build -o out/provider-surface-oracle ./lawkit/oracles/provider-surface-v01
          echo ORACLE_OK

      - name: Reconfirm exact pre-demand source boundary
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$TRUEFORGE_REPO" subject
          git -C subject checkout --detach "$TRUEFORGE_BASE"
          test "$(git -C subject rev-parse HEAD)" = "$TRUEFORGE_BASE"
          test -z "$(git -C subject status --porcelain)"
          grep -F "export interface IWebSearchProvider" subject/packages/trueforge-core/src/core/web-search/WebSearchProvider.ts >/dev/null
          grep -F "search(input:" subject/packages/trueforge-core/src/core/web-search/WebSearchProvider.ts >/dev/null
          grep -F "fetch(input:" subject/packages/trueforge-core/src/core/web-search/WebSearchProvider.ts >/dev/null
          grep -F "WEB_SEARCH_TOOL_NAME" subject/packages/trueforge-core/src/core/capabilities/builtins/WebSearch.ts >/dev/null
          grep -F "WEB_FETCH_TOOL_NAME" subject/packages/trueforge-core/src/core/capabilities/builtins/WebSearch.ts >/dev/null
          echo SOURCE_OK

      - name: Self-test future exposure verdict grammar
        run: |
          set -euo pipefail
          cat > out/wide-probe.json <<'JSON'
          {
            "treatment":"WIDE_BOUNDARY_REUSE",
            "network":"MOCK_ONLY",
            "secret_leak":false,
            "parallel":{"tools":["web_search","web_fetch"],"search":"PASS","fetch":"PASS"},
            "phase0":{"provider":"exa","tools":["web_search","web_fetch"],"search":"PASS","fetch":"PASS"},
            "phase1":{"provider":"tavily","tools":["web_search","web_fetch"],"search":"PASS","fetch":"PASS"}
          }
          JSON
          cat > out/seg-probe.json <<'JSON'
          {
            "treatment":"CAPABILITY_SEGREGATED",
            "network":"MOCK_ONLY",
            "secret_leak":false,
            "parallel":{"tools":["web_search","web_fetch"],"search":"PASS","fetch":"PASS"},
            "phase0":{"provider":"exa","tools":["web_search"],"search":"PASS","fetch":"HIDDEN"},
            "phase1":{"provider":"tavily","tools":["web_search"],"search":"PASS","fetch":"HIDDEN"}
          }
          JSON
          node tools/p11-p1-exposure-verify.mjs WIDE_BOUNDARY_REUSE out/wide-probe.json
          node tools/p11-p1-exposure-verify.mjs CAPABILITY_SEGREGATED out/seg-probe.json
          echo EXPOSURE_GRAMMAR_OK

      - name: Seal preseal receipt and custody
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r={
            "stage":"EvoNOMOS Generation VIII ORIGIN-R1-P11-P1",
            "status":"PRESEAL_PASS__ZERO_TREATMENT_BYTES__OUTCOMES_CLOSED",
            "source":"dd421b79216c9b42eefd7b0191e546919f8be3f1",
            "rivals":["WIDE_BOUNDARY_REUSE","CAPABILITY_SEGREGATED"],
            "dual_real_demand":[852,853],
            "oracle":"SEARCH_FETCH_EXPOSURE_V01",
            "vector":["S","L","C","A","Q"],
            "measurement_firewall_released":False,
            "winner":None
          }
          Path("out/preseal-receipt.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
          sha256sum             "$ACTIVE/contract/DUAL_REAL_DEMAND_CONTRACT.json"             "$ACTIVE/contract/RIVAL_CONSTITUTION.json"             "$ACTIVE/contract/OUTCOME_FIREWALL.json"             "$ACTIVE/contract/SEARCH_FETCH_EXPOSURE_ORACLE.json"             out/provider-surface-oracle             out/preseal-receipt.json             | sort > out/preseal-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: p11-p1-preseal
          path: out/
          retention-days: 30
