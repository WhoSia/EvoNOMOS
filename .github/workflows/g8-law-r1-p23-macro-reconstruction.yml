name: G8 LAW-R1-P23 Macro-Structure Reconstruction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'active/g8-law-r1-p23/**'
      - 'lawkit/protocol/v0.27/**'
      - 'tools/law-r1-p23-*'
      - '.github/workflows/g8-law-r1-p23-macro-reconstruction.yml'

permissions:
  contents: read

jobs:
  reconstruction:
    name: P23 Macro-Structure Reconstruction
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EvoNOMOS
        uses: actions/checkout@v4

      - name: Set Up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.4'

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Prepare P23 Output
        run: mkdir -p out-p23

      - name: Run Repair-Monoid Mathematics
        run: |
          ghc -O2 tools/law-r1-p23-math-check.hs -o out-p23/p23-math-check
          out-p23/p23-math-check

      - name: Run Kubernetes Order-Reversal Intervention
        run: go run tools/law-r1-p23-kubernetes-order.go

      - name: Run Macro-Structure Reconstruction
        run: |
          node tools/law-r1-p23-reconstruction.mjs \
            out-p23/p23-math.json \
            out-p23/p23-kubernetes.json \
            out-p23/p23-reconstruction.json

      - name: Run Post-Fresh Opposite-Band Mathematics
        run: |
          mkdir -p out-p23-post
          ghc -O2 tools/law-r1-p23-post-math-check.hs -o out-p23-post/p23-post-math-check
          out-p23-post/p23-post-math-check

      - name: Upload P23 Reconstruction Artifact
        uses: actions/upload-artifact@v4
        with:
          name: g8-law-r1-p23-macro-reconstruction
          path: |
            out-p23/p23-math.json
            out-p23/p23-kubernetes.json
            out-p23/p23-reconstruction.json
            out-p23-post/p23-post-math.json
          retention-days: 30
