name: P42 R11 P10 Preregistered Original Gin Echo Client Capability Reversal

on:
  push:
    branches: [main]
    paths:
      - 'tools/p42/p2-r11/frozen_p10_gin_echo_independent_source_precontent_pr_court.json'
      - 'tools/p42/p2-r11-go/p10_*original_independent_demand_test.go'
      - 'tools/p42/p2-r11-go/p10_echo_external_client_source_test.go'
      - '.github/workflows/g8-p42-r11-p10-gin-echo-independent-source.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  original-maintained-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: gin-gonic/gin
          ref: d3ffc9985281dcf4d3bef604cce4e662b1a327a6
          path: tools/p42/p2-r11-go/p10-gin-original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: labstack/echo
          ref: 86d0223c7aa39b865a9452de3479897fcb5a3939
          path: tools/p42/p2-r11-go/p10-echo-original
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: {go-version: '1.25',cache: false}
      - name: Enforce prereg before Go code and before heldout PR contents
        run: |
          set -eu
          mkdir -p out/p42-r11-p10
          seal=35a3c8980206d38b4f65c508650336a453ecfbdd
          git merge-base --is-ancestor "$seal" HEAD
          git show "$seal":tools/p42/p2-r11/frozen_p10_gin_echo_independent_source_precontent_pr_court.json > out/p42-r11-p10/prereg-frozen.json
          cmp out/p42-r11-p10/prereg-frozen.json tools/p42/p2-r11/frozen_p10_gin_echo_independent_source_precontent_pr_court.json
          ! git cat-file -e "$seal":tools/p42/p2-r11-go/p10_gin_original_independent_demand_test.go 2>/dev/null
          ! git cat-file -e "$seal":tools/p42/p2-r11-go/p10_echo_original_independent_demand_test.go 2>/dev/null
          a=tools/p42/p2-r11-go/p10-gin-original
          b=tools/p42/p2-r11-go/p10-echo-original
          test "$(git -C "$a" rev-parse HEAD)" = d3ffc9985281dcf4d3bef604cce4e662b1a327a6
          test "$(git -C "$b" rev-parse HEAD)" = 86d0223c7aa39b865a9452de3479897fcb5a3939
          test "$(git -C "$a" hash-object response_writer.go)" = 9035e6f1fd794d54063d6f50c3490e64d35a3647
          test "$(git -C "$b" hash-object response.go)" = 4da729c4786898ddb2dc361c19a303e55d149540
          cp tools/p42/p2-r11-go/p10_gin_original_independent_demand_test.go "$a/evonomos_p42_r11_p10_native_test.go"
          mkdir -p "$b/evonomos-p10-client"
          cp tools/p42/p2-r11-go/p10_echo_external_client_source_test.go "$b/evonomos-p10-client/evonomos_p42_r11_p10_native_test.go"
          echo PRE_NATIVE_INDEPENDENT_SOURCE_AND_FROZEN_PR_IDS_PASS
      - name: Gin pinned original source, no-flush graceful case
        working-directory: tools/p42/p2-r11-go/p10-gin-original
        run: |
          set -euo pipefail
          go test . -run '^TestEvoNOMOSP10OriginalGin' -count=1 -v | tee "$GITHUB_WORKSPACE/out/p42-r11-p10/gin-native.log"
      - name: Echo pinned original source, no-flush fail-fast case
        working-directory: tools/p42/p2-r11-go/p10-echo-original
        run: |
          set -euo pipefail
          go test ./evonomos-p10-client -run '^TestEvoNOMOSP10Echo' -count=1 -v | tee "$GITHUB_WORKSPACE/out/p42-r11-p10/echo-native.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p42-r11-p10-gin-echo-original-source-client-capability
          path: out/p42-r11-p10/
