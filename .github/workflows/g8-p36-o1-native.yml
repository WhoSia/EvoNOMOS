name: G8 P36 O1 Original Chi Post-Baseline Cost Comparison
on:
  push:
    branches: [main]
    paths:
      - 'tools/p36-o1/**'
      - '.github/workflows/g8-p36-o1-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-original-chi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arm: [EAGER, LAZY]
    env:
      P35_O6_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23', cache: false}
      - uses: actions/checkout@v4
        with:
          repository: go-chi/chi
          ref: 67be7d9cafdaeb4e04e887ff78d09e030ee43b00
          path: chi
          fetch-depth: 1
      - name: Original source correctness and revised maintenance-only benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/p36-o1/${{ matrix.arm }}
          test "$(git -C chi rev-parse HEAD)" = 67be7d9cafdaeb4e04e887ff78d09e030ee43b00
          case "${{ matrix.arm }}" in
            EAGER) source=tools/p35-o6/arms/eager/p35_epoch_router.go ;;
            LAZY) source=tools/p35-o6/arms/lazy/p35_epoch_router.go ;;
            *) exit 97 ;;
          esac
          cp "$source" chi/middleware/p35_epoch_router.go
          cp tools/p35-o6/tests/chi/p35_o6_eager_lazy_test.go chi/middleware/
          cp tools/p36-o1/tests/chi/p36_o1_postbaseline_benchmark_test.go chi/middleware/
          (cd chi && go vet ./middleware) >out/p36-o1/${{ matrix.arm }}/vet.log 2>&1 || { cat out/p36-o1/${{ matrix.arm }}/vet.log; exit 11; }
          (cd chi && go test -race -count=1 ./middleware) >out/p36-o1/${{ matrix.arm }}/race.log 2>&1 || { cat out/p36-o1/${{ matrix.arm }}/race.log; exit 12; }
          (cd chi && go test -count=1 ./...) >out/p36-o1/${{ matrix.arm }}/full-original.log 2>&1 || { cat out/p36-o1/${{ matrix.arm }}/full-original.log; exit 13; }
          (cd chi && GOMAXPROCS=1 go test -run '^$' -bench '^Benchmark(P35O6|P36PostBaseline)' -benchtime=250ms -count=5 -benchmem ./middleware) >out/p36-o1/${{ matrix.arm }}/benchmark.log 2>&1 || { cat out/p36-o1/${{ matrix.arm }}/benchmark.log; exit 14; }
          grep -q 'BenchmarkP36PostBaselineBurst' out/p36-o1/${{ matrix.arm }}/benchmark.log
          grep -q 'BenchmarkP36PostBaselineInterleaved' out/p36-o1/${{ matrix.arm }}/benchmark.log
          sha256sum "$source" tools/p35-o6/tests/chi/p35_o6_eager_lazy_test.go tools/p36-o1/tests/chi/p36_o1_postbaseline_benchmark_test.go >out/p36-o1/${{ matrix.arm }}/sha256.txt
          echo P36_O1_ORIGINAL_CHI_SCOPED_BENCH_AND_RACE_PASS | tee out/p36-o1/${{ matrix.arm }}/verdict.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p36-o1-${{ matrix.arm }}-scoped-original-go
          path: out/p36-o1/${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 30
