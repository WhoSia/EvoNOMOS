name: EvoNOMOS Chat26 F37 HandlerFunc adapter court
on:
  push:
    branches:
      - research/law-r1-p44-r3-stateful-alias-court
    paths:
      - 'active/g8-law-r1-p44/f34_original_router_capability/chat26_adapter_semantics_test.go'
      - '.github/workflows/chat26-f37-adapter-court.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-go-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/f34_original_router_capability
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Go 1.23.2 pinned
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Check dependency checksums
        run: go mod verify
      - name: Go static vet
        run: go vet -mod=readonly ./...
      - name: Full pinned source Go tests
        run: go test -mod=readonly -count=1 -v ./...
      - name: Original Go race test
        run: go test -mod=readonly -race -count=1 ./...
