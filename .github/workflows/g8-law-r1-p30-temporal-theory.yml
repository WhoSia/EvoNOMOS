name: G8 LAW-R1-P30 Phase II-C Temporal Theory

on:
  push:
    branches: [main]
    paths:
      - 'tools/law-r1-p30-temporal-checker.mjs'
      - 'active/g8-law-r1-p30/P30_PHASE_IIC_TEMPORAL_PRESEAL.json'
      - '.github/workflows/g8-law-r1-p30-temporal-theory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-theory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Verify prospective files
        run: |
          set -euo pipefail
          test -f active/g8-law-r1-p30/P30_PHASE_IIC_TEMPORAL_SUFFICIENCY_CORRECTION.md
          test -f active/g8-law-r1-p30/P30_PHASE_IIC_TEMPORAL_PRESEAL.json
          test -f tools/law-r1-p30-temporal-checker.mjs
      - name: Run temporal theorem regression
        run: |
          set -euo pipefail
          node tools/law-r1-p30-temporal-checker.mjs | tee P30_TEMPORAL_THEORY.txt
      - name: Upload theory receipt only
        uses: actions/upload-artifact@v4
        with:
          name: g8-law-r1-p30-temporal-theory
          path: P30_TEMPORAL_THEORY.txt
