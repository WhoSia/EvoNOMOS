name: G8 P12 Restic World Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'active/g8-origin-r1-p12/world/RESTIC_*.json'
      - 'lawkit/adapters/go-backend-contract-v01/**'
      - 'tools/lawkit-p12-restic-audit-verify.mjs'
      - '.github/workflows/g8-p12-restic-world-audit.yml'

permissions:
  contents: read
  actions: read

env:
  SUBJECT_REPO: https://github.com/restic/restic.git
  BASE: 495982232cf1af184eac0a97871ef8161e8708ee
  WORLD: active/g8-origin-r1-p12/world/RESTIC_OCI_ONEDRIVE_WORLD.json
  SPEC: active/g8-origin-r1-p12/world/RESTIC_BACKEND_AUDIT_SPEC.json

jobs:
  audit:
    name: Go AST backend contract + independent world verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: evonomos

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false

      - name: Reconstruct exact pre-demand Restic source
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$SUBJECT_REPO" subject >/dev/null 2>&1
          git -C subject checkout --quiet --detach "$BASE"
          test "$(git -C subject rev-parse HEAD)" = "$BASE"
          test -z "$(git -C subject status --porcelain)"
          echo SOURCE_OK

      - name: Build and run Go AST source adapter
        run: |
          set -euo pipefail
          mkdir -p out
          pushd evonomos/lawkit/adapters/go-backend-contract-v01 >/dev/null
          gofmt -w main.go
          test -z "$(gofmt -l main.go)"
          go test ./...
          go build -o "$GITHUB_WORKSPACE/go-backend-contract-audit" .
          popd >/dev/null
          "$GITHUB_WORKSPACE/go-backend-contract-audit"             --repo subject             --spec "evonomos/$SPEC"             --out out/restic-backend-audit.json

      - name: Independent world-admission eligibility verification
        run: |
          set -euo pipefail
          node evonomos/tools/lawkit-p12-restic-audit-verify.mjs             "evonomos/$WORLD"             out/restic-backend-audit.json             out/restic-world-verdict.json

      - name: Seal source-audit custody
        run: |
          set -euo pipefail
          sha256sum out/*.json | sort > out/p12-restic-world-audit.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: p12-restic-world-audit
          path: out/
          retention-days: 30
