name: P44 F30 Fresh Pointer Source Frame
on:
  push:
    branches:
      - research/law-r1-p44-r3-stateful-alias-court
    paths:
      - 'active/g8-law-r1-p44/formalization/f30_fresh_pointer/**'
      - '.github/workflows/p44-f30-fresh-pointer.yml'
  pull_request:
    paths:
      - 'active/g8-law-r1-p44/formalization/f30_fresh_pointer/**'
      - '.github/workflows/p44-f30-fresh-pointer.yml'
permissions:
  contents: read
jobs:
  source-frame:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: active/g8-law-r1-p44/formalization/f30_fresh_pointer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Compile, validate AST, run real alias mutants, vet and race
        run: |
          set -euo pipefail
          go version
          go test -count=1 -v ./...
          go vet ./...
          go test -race -count=1 ./...
