name: EvoNOMOS P44-R3 External Chi Issue 825 Court

on:
  push:
    branches:
      - 'research/law-r1-p44-r3-*'
    paths:
      - 'active/g8-law-r1-p44/r3/issue825/**'
      - '.github/workflows/evonomos-p44-r3-external825.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-chi-requestid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/r3/issue825
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: "Original Chi v5.1.0 source checksum"
        run: |
          go version
          go mod download -json github.com/go-chi/chi/v5@v5.1.0 | tee chi_download.json
          grep -F '"Sum": "h1:acVI1TYaD+hhedDJ3r54HyA6sExp3HfXq7QWEEY/xMw="' chi_download.json
          grep -F '"GoModSum": "h1:DslCQbL2OYiznFReuXYUmQ2hGd1aDpCnlMNITLSKoi8="' chi_download.json
          go mod verify
      - name: "Source issue reproduction and one-unit authorized repair"
        run: go test -count=1 -v ./...
      - name: "Static checks"
        run: go vet ./...
      - name: "Race check"
        run: go test -count=1 -race ./...
