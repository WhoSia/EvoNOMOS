name: EvoNOMOS P44-R3 Stateful Middleware Alias Court

on:
  push:
    branches:
      - 'research/law-r1-p44-r3-*'
    paths:
      - 'active/g8-law-r1-p44/r3/**'
      - '.github/workflows/evonomos-p44-r3-alias-court.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/r3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: "Pinned maintained middleware source provenance"
        run: |
          go version
          cd native
          go mod download -json github.com/go-chi/chi/v5@v5.1.0 | tee chi_download.json
          grep -F '"Sum": "h1:acVI1TYaD+hhedDJ3r54HyA6sExp3HfXq7QWEEY/xMw="' chi_download.json
          grep -F '"GoModSum": "h1:DslCQbL2OYiznFReuXYUmQ2hGd1aDpCnlMNITLSKoi8="' chi_download.json
          go list -m -json github.com/go-chi/chi/v5
      - name: "Local application-owned semantic reference"
        run: |
          cd core
          go test -count=1 -v ./...
          go vet ./...
          go test -count=1 -race ./...
      - name: "Classical AST source-alias rival"
        run: |
          cd static
          go test -count=1 -v ./...
          go vet ./...
          go test -count=1 -race ./...
      - name: "Original Chi RequestID vs ServeMux native temporal observation"
        run: |
          cd native
          go test -count=1 -v ./...
          go vet ./...
          go test -count=1 -race ./...
