name: EvoNOMOS LawKit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/evonomos-law/**'
      - 'tools/lawkit*.mjs'
      - 'lawkit/**'
      - 'lawkit/fixtures/**'
      - '.github/workflows/evonomos-lawkit.yml'

concurrency:
  group: evonomos-lawkit
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  lawkit:
    name: Cross-language conditional-law kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust kernel quality gates
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/evonomos-law/Cargo.toml -- --check
          cargo clippy --manifest-path crates/evonomos-law/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/evonomos-law/Cargo.toml
          cargo build --release --manifest-path crates/evonomos-law/Cargo.toml

      - name: v0.1 pre-outcome cross-language concordance
        run: |
          set -euo pipefail
          mkdir -p out
          INPUT=lawkit/fixtures/cil-c1-p10-mikrotik-moderator.json
          ./crates/evonomos-law/target/release/evonomos-law inspect "$INPUT" > out/cil-c1-rust.json
          python3 lawkit/reference/cil_c1_v01.py "$INPUT" > out/cil-c1-python.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for src,dst in [
              ("out/cil-c1-rust.json","out/cil-c1-rust.canon.json"),
              ("out/cil-c1-python.json","out/cil-c1-python.canon.json"),
          ]:
              x=json.loads(Path(src).read_text())
              Path(dst).write_text(json.dumps(x,sort_keys=True,separators=(",",":"))+"\n")
          PY
          diff -u out/cil-c1-rust.canon.json out/cil-c1-python.canon.json
          node tools/lawkit-verify.mjs out/cil-c1-rust.json
          echo EVONOMOS_LAWKIT_V01_CONCORDANCE=PASS

      - name: v0.2 post-outcome authority concordance fixture
        run: |
          set -euo pipefail
          MOD=lawkit/fixtures/cil-c1-p10-mikrotik-moderator.json
          cat > out/v02-lifecycle-fixture.json <<'JSON'
          {
            "vectors": {
              "DIRECT_DEDICATED": {"S0":7,"L0":20,"Q0":1,"S1":7,"L1":14,"Q1":1},
              "INVERT_CHANNEL_ADAPTER": {"S0":8,"L0":30,"Q0":1,"S1":4,"L1":8,"Q1":1}
            }
          }
          JSON
          cat > out/v02-firewall-fixture.json <<'JSON'
          {
            "lawkit_required_authority":"HOLD_SELECTION_BLINDNESS",
            "forbidden":[
              "confirmatory CIL-C1 update",
              "SOLID/DIP/OCP validation",
              "overall winner",
              "general design recommendation"
            ]
          }
          JSON
          ./crates/evonomos-law/target/release/evonomos-law adjudicate             "$MOD" out/v02-lifecycle-fixture.json out/v02-firewall-fixture.json             > out/cil-c1-v02-rust.json
          python3 lawkit/reference/cil_c1_v02.py             "$MOD" out/v02-lifecycle-fixture.json out/v02-firewall-fixture.json             > out/cil-c1-v02-python.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for src,dst in [
              ("out/cil-c1-v02-rust.json","out/cil-c1-v02-rust.canon.json"),
              ("out/cil-c1-v02-python.json","out/cil-c1-v02-python.canon.json"),
          ]:
              x=json.loads(Path(src).read_text())
              Path(dst).write_text(json.dumps(x,sort_keys=True,separators=(",",":"))+"\n")
          PY
          diff -u out/cil-c1-v02-rust.canon.json out/cil-c1-v02-python.canon.json
          node tools/lawkit-v02-verify.mjs out/cil-c1-v02-rust.json
          echo EVONOMOS_LAWKIT_V02_CONCORDANCE=PASS

      - name: v0.3 fresh-world admission concordance
        run: |
          set -euo pipefail
          WORLD=lawkit/fixtures/p11-trueforge-exa-tavily-world.json
          ./crates/evonomos-law/target/release/evonomos-law admit-world "$WORLD" > out/world-v03-rust.json
          python3 lawkit/reference/world_admission_v03.py "$WORLD" > out/world-v03-python.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for src,dst in [
              ("out/world-v03-rust.json","out/world-v03-rust.canon.json"),
              ("out/world-v03-python.json","out/world-v03-python.canon.json"),
          ]:
              x=json.loads(Path(src).read_text())
              Path(dst).write_text(json.dumps(x,sort_keys=True,separators=(",",":"))+"\n")
          PY
          diff -u out/world-v03-rust.canon.json out/world-v03-python.canon.json
          node tools/lawkit-world-v03-verify.mjs out/world-v03-rust.json
          test "$(python3 -c "import json;print(json.load(open('out/world-v03-rust.json'))['admission'])")" = "ADMIT"
          echo EVONOMOS_LAWKIT_V03_CONCORDANCE=PASS

      - name: Seal tool custody
        run: |
          set -euo pipefail
          sha256sum crates/evonomos-law/target/release/evonomos-law > out/evonomos-law-binary-sha256.txt
          sha256sum out/cil-c1-rust.json > out/cil-c1-p10-preoutcome-sha256.txt
          sha256sum out/world-v03-rust.json > out/p11-world-v03-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: evonomos-lawkit
          path: out/
          retention-days: 30
