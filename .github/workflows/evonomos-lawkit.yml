name: EvoNOMOS LawKit v0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/evonomos-law/**'
      - 'tools/lawkit-verify.mjs'
      - 'lawkit/**'
      - 'active/g8-origin-r1-p10-p1/contract/PRETREATMENT_MODERATOR_VECTOR.json'
      - '.github/workflows/evonomos-lawkit.yml'

concurrency:
  group: evonomos-lawkit-v01
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  lawkit:
    name: CIL-C1 executable theory kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust kernel quality gates
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/evonomos-law/Cargo.toml -- --check
          cargo clippy --manifest-path crates/evonomos-law/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/evonomos-law/Cargo.toml
          cargo build --release --manifest-path crates/evonomos-law/Cargo.toml

      - name: Compile P10 moderator evidence with independent implementations
        run: |
          set -euo pipefail
          mkdir -p out
          INPUT=active/g8-origin-r1-p10-p1/contract/PRETREATMENT_MODERATOR_VECTOR.json
          ./crates/evonomos-law/target/release/evonomos-law inspect "$INPUT" > out/cil-c1-rust.json
          python3 lawkit/reference/cil_c1_v01.py "$INPUT" > out/cil-c1-python.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for src,dst in [
              ("out/cil-c1-rust.json","out/cil-c1-rust.canon.json"),
              ("out/cil-c1-python.json","out/cil-c1-python.canon.json"),
          ]:
              x=json.loads(Path(src).read_text())
              Path(dst).write_text(json.dumps(x,sort_keys=True,separators=(",",":"))+"\n")
          PY
          diff -u out/cil-c1-rust.canon.json out/cil-c1-python.canon.json
          cp out/cil-c1-rust.json out/cil-c1-p10-preoutcome.json
          node tools/lawkit-verify.mjs out/cil-c1-p10-preoutcome.json | tee out/lawkit-independent-verification.txt
          echo EVONOMOS_LAWKIT_RUST_PYTHON_CONCORDANCE=PASS | tee out/lawkit-concordance.txt
          sha256sum crates/evonomos-law/target/release/evonomos-law > out/evonomos-law-binary-sha256.txt
          sha256sum out/cil-c1-p10-preoutcome.json > out/cil-c1-p10-preoutcome-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: evonomos-lawkit-v01-cil-c1
          path: out/
          retention-days: 30
