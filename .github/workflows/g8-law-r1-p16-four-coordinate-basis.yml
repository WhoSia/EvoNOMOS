name: G8 LAW-R1-P16 Four-Coordinate Context-Basis Court

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/law-r1-p16-*'
      - 'active/g8-law-r1-p16/**'
      - 'lawkit/protocol/v0.20/**'
      - '.github/workflows/g8-law-r1-p16-four-coordinate-basis.yml'

permissions:
  contents: read

jobs:
  four-coordinate-basis:
    name: P16 Four-Coordinate Operational Minimal-Basis Court
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EvoNOMOS
        uses: actions/checkout@v4
      - name: Prepare P16 Output
        run: mkdir -p out-p16
      - name: Verify P16 Lifecycle Replication and Basis Exhaustion
        run: python3 tools/law-r1-p16-basis.py
      - name: Run P16 Four-Coordinate Context-Basis Court
        run: node tools/law-r1-p16-court.mjs out-p16/p16-basis.json out-p16/p16-court.json
      - name: Upload P16 Four-Coordinate Context-Basis Artifact
        uses: actions/upload-artifact@v4
        with:
          name: g8-law-r1-p16-four-coordinate-basis
          path: out-p16/
          retention-days: 30
