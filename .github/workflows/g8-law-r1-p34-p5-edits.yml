name: G8 LAW-R1-P34 P5 Paired Go Source Modification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/p34-p5/**'
      - '.github/workflows/g8-law-r1-p34-p5-edits.yml'

permissions:
  contents: read
  actions: read

jobs:
  source-edits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/checkout@v4
        with:
          repository: restic/restic
          ref: 495982232cf1af184eac0a97871ef8161e8708ee
          path: restic
          fetch-depth: 1
      - name: Materialize independent source variants and their patches
        run: |
          set -euo pipefail
          mkdir -p out
          node tools/p34-p5/materialize.mjs restic
          diff -u tools/p34-p4/pair.go restic/internal/backend/p34p5direct/pair.go > out/direct.patch || test "$?" -eq 1
          diff -u tools/p34-p4/pair.go restic/internal/backend/p34p5composed/pair.go > out/composed.patch || test "$?" -eq 1

      - name: Show genuine new-demand failure in untouched baseline
        run: |
          set -euo pipefail
          cd restic
          go test -count=1 -run 'TestP34NewPairedRealResticInterface|TestP34DemandWideningAcrossSameAdapters' ./internal/backend/p34p5baseline
          set +e
          P34_ARM=direct go test -count=1 -run '^TestP34P5KeyFileLengthBound$' ./internal/backend/p34p5baseline > ../out/baseline-required-failure.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "Baseline unexpectedly meets new demand"; exit 1; fi
          grep -q 'new requirement violated' ../out/baseline-required-failure.log
          echo "P34_P5_ORIGINAL_BASELINE_FAILS_NEW_DEMAND=PASS"
      - name: Independently compile and test both changed source worlds
        run: |
          set -euo pipefail
          for arm in direct composed; do
            echo "P34-P5 treatment=$arm"
            ( cd restic && P34_ARM="$arm" go test -count=1 -v "./internal/backend/p34p5$arm" ) | tee "out/$arm-go-test.log"
            grep -q 'P34_P5_NEW_MAINTENANCE_CONTRACT=PASS' "out/$arm-go-test.log"
            grep -q 'P34_P4_RESTIC_PAIR_PASS' "out/$arm-go-test.log"
            grep -q 'P34_P4B_CLIENT_CONTRACT_WIDENING=PASS' "out/$arm-go-test.log"
          done

      - name: Verify actual edit geometry and preserve original P12
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('out/p34-p5-source-diffs.json'));
          const c=j.variants;
          for(const arm of ['direct','composed']){
            if(c[arm].file_count!==1 || c[arm].method_count!==1)process.exit(1);
            if(c[arm].added_lines!==4 || c[arm].removed_lines!==1)process.exit(1);
            if(c[arm].sha256===j.baseline_sha256)process.exit(1);
          }
          if(c.direct.sha256===c.composed.sha256)process.exit(1);
          const old=JSON.parse(fs.readFileSync('lawkit/fixtures/p12-terminal-closure.json'));
          if(old.terminal_status!=='TERMINAL_NONRESULT')process.exit(1);
          console.log('P34_P5_PAIRED_SOURCE_DIFFS_AND_CORRECTNESS=PASS');
          NODE
          sha256sum tools/p34-p5/* out/*.patch out/*.log out/*.json > out/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: p34-p5-actual-source-edit-comparison
          path: out/
          retention-days: 30
