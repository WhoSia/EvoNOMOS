name: EvoNOMOS P44 Closed Go Source DSL Court

on:
  push:
    branches:
      - 'research/law-r1-p44-r3-*'
    paths:
      - 'active/g8-law-r1-p44/formalization/sourcecourt/**'
      - '.github/workflows/evonomos-p44-closed-go-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-source-edit-and-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/formalization/sourcecourt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Closed grammar AST source edit enumeration and finite runtime semantics
        run: |
          go version
          go test -count=1 -v ./...
          go vet ./...
          go test -count=1 -race ./...
