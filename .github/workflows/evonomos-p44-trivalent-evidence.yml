name: EvoNOMOS P44 Under/Over Source-Evidence Court

on:
  push:
    branches:
      - 'research/law-r1-p44-r3-*'
    paths:
      - 'active/g8-law-r1-p44/formalization/evidence/**'
      - '.github/workflows/evonomos-p44-trivalent-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-trace-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: active/g8-law-r1-p44/formalization/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: "Finite under/over and stagewise repaired-path proof controls"
        run: |
          go version
          go test -count=1 -v ./...
          go vet ./...
          go test -count=1 -race ./...
