name: G8 LAW-R1-P33 Information-Cut Repair World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/law-r1-p33-info-cut-repair-world.mjs'
      - 'tools/law-r1-p33-repair-cut-certificate.mjs'
      - 'tools/law-r1-p33-demand-quotient.mjs'
      - 'tools/law-r1-p33-lsp-dip-contract-graph.mjs'
      - 'tools/law-r1-p33-contract-poset.mjs'
      - '.github/workflows/g8-law-r1-p33-information-cut.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: g8-law-r1-p33-information-cut
  cancel-in-progress: true

jobs:
  bounded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact source birth
        uses: actions/checkout@v4
        with:
          repository: louislam/uptime-kuma
          ref: 398482d590daaac0d44e288c9be3bc6f6667f8b8
          path: world
          fetch-depth: 1

      - name: Execute both bounded repair choices and collision oracle
        run: |
          set -euo pipefail
          mkdir -p out
          node tools/law-r1-p33-info-cut-repair-world.mjs world out/p33-info-cut.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('out/p33-info-cut.json','utf8'));
          if (!x.safe_domain_oracle_both_pass || !x.extended_collision_oracle_only_caller_passes) process.exit(1);
          if (x.results.caller.collision_oracle!=='PASS' || x.results.dispatcher.collision_oracle!=='FAIL') process.exit(1);
          if (!x.verdict.includes("STRONG_B2_NOT_BEATEN")) process.exit(1);
          console.log('P33_BOUNDED_ALTERNATIVE_REPAIRS=PASS_METHOD_ONLY');
          NODE
          node tools/law-r1-p33-repair-cut-certificate.mjs out/p33-info-cut.json out/p33-cut-certificate.json
          node - <<'NODE'
          const f=require('fs');
          const x=JSON.parse(f.readFileSync('out/p33-cut-certificate.json','utf8'));
          if(x.collision_pair_count!==64 || x.minimal_obstruction_hitting_sets.length!==1) process.exit(1);
          if(x.prior_code_executed_results.all_64_pairs.caller.passed_pairs!==64) process.exit(1);
          if(x.prior_code_executed_results.all_64_pairs.dispatcher.failed_pairs!==64) process.exit(1);
          if(x.verdict!=='PINNED_TWO_REPAIR_64_PAIR_EXECUTED_ORACLE_PASS__SOURCE_SITE_IDENTIFICATION_RETROSPECTIVE__SCIENCE_HOLD') process.exit(1);
          console.log('P33_OBSTRUCTION_CUT_CERTIFICATE=PASS_METHOD_ONLY');
          NODE
          node tools/law-r1-p33-demand-quotient.mjs out/p33-info-cut.json out/p33-solid-quotient.json
          node - <<'NODE'
          const f=require('fs');
          const r=JSON.parse(f.readFileSync('out/p33-solid-quotient.json','utf8'));
          if(r.exhaustive_factorization_pairs!==65536)process.exit(1);
          if(r.min_interface_labels_for_A!==2 || r.min_interface_labels_for_A_and_B!==4)process.exit(1);
          if(r.source_receipts!=='bounded source execution already verified 64/64 vs 0/64')process.exit(1);
          if(!r.verdict.includes('FORMAL_REINTERPRETATION_PASS'))process.exit(1);
          console.log('P33_FINITE_DEMAND_RELATIVE_QUOTIENT=PASS_INTERPRETIVE_THEORY');
          NODE
          node tools/law-r1-p33-lsp-dip-contract-graph.mjs out/p33-lsp-dip-finite.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('out/p33-lsp-dip-finite.json','utf8'));
          if(x.examined_trace_contract_triplets!==4096)process.exit(1);
          if(!x.cross_principle_cases.all_bounded_conditions.inversion ||
             x.cross_principle_cases.LSP_and_DIP_but_new_demand_unobservable.demandAdequacy ||
             x.cross_principle_cases.LSP_but_DIP_not_satisfied.inversion ||
             x.cross_principle_cases.DIP_but_LSP_not_satisfied.traceRefinement)process.exit(1);
          if(x.provider_cases.silent_progress!==false)process.exit(1);
          console.log('P33_LSP_DIP_FINITE_INTERPRETIVE_CERTIFICATE=PASS');
          NODE
          node tools/law-r1-p33-contract-poset.mjs out/p33-contract-poset.json
          node - <<'NODE'
          const f=require('fs');
          const x=JSON.parse(f.readFileSync('out/p33-contract-poset.json','utf8'));
          if(x.contracts_enumerated!==16 || x.triple_cases!==4096) process.exit(1);
          if(!x.refinements.pass || !x.verdict.includes('CONCEPTUAL_SOLID_THEORY_BOUNDED_CLOSE_CANDIDATE')) process.exit(1);
          console.log('P33_CLASSICAL_AG_CONTRACT_ORDER=PASS');
          NODE
          sha256sum tools/law-r1-p33-*.mjs out/*.json > out/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: g8-law-r1-p33-information-cut
          path: out/
          retention-days: 30
