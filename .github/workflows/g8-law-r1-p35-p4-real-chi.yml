name: G8 LAW-R1-P35 P4 Independent Chi Maintenance Tournament

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/p35-p4/arms/**'
      - 'tools/p35-p4/audit.py'
      - 'tools/p35-p4/run_native_chi.sh'
      - '.github/workflows/g8-law-r1-p35-p4-real-chi.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: g8-law-r1-p35-p4-real-chi
  cancel-in-progress: false

jobs:
  paired-native-chi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Checkout Frozen Original Chi Release
        uses: actions/checkout@v4
        with:
          repository: go-chi/chi
          ref: 67be7d9cafdaeb4e04e887ff78d09e030ee43b00
          path: chi
          fetch-depth: 1
      - name: Original Go, Baseline Negative, Both Source Arms and Matched Rival Audit
        shell: bash
        run: |
          set -euo pipefail
          bash tools/p35-p4/run_native_chi.sh
      - name: Preserve Read-Only Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-law-r1-p35-p4-native-chi-two-arm-tournament
          path: out/p35-p4/
          if-no-files-found: warn
          retention-days: 30
