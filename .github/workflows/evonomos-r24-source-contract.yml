name: EvoNOMOS R24 Finite Contract Court

on:
  push:
    branches:
      - 'research/p43-r24-*'
    paths:
      - 'active/g8-law-r1-p43/r24/**'
      - '.github/workflows/evonomos-r24-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-stdlib-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: active/g8-law-r1-p43/r24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Test finite contract observer
        run: go test -v ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race ./...
