name: DIP70 WC6-X paired execution

on:
  push:
    branches: [agent/dip70-wc6x-circleup369]
    paths:
      - 'experiments/dip70_wc6x/**'
      - '.github/workflows/dip70-wc6x.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Acquire harness and exact upstream base
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --branch agent/dip70-wc6x-circleup369 --single-branch https://github.com/WhoSia/EvoNOMOS.git harness
          git clone -q https://github.com/CIRCLEUP-AJO/CIRCLEUP.git upstream
          git -C upstream checkout -q 9f056cd3e340361947d3bb5e7b63ae2edf47b445
          test "$(git -C upstream rev-parse HEAD)" = "9f056cd3e340361947d3bb5e7b63ae2edf47b445"
          test -z "$(git -C upstream status --porcelain)"
          echo "BASE_IDENTITY=PASS"
          git -C upstream worktree add -q ../DIRECT -b evonomos-wc6-direct 9f056cd3e340361947d3bb5e7b63ae2edf47b445
          git -C upstream worktree add -q ../INVERT -b evonomos-wc6-invert 9f056cd3e340361947d3bb5e7b63ae2edf47b445

      - name: Baseline native build and tests
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/indexer
          npm ci --no-audit --no-fund
          npm run build
          npm test
          echo "BASELINE_NATIVE=PASS"

      - name: Materialize phase 0 without historical-fix input
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/experiments/dip70_wc6x/materialize.py DIRECT DIRECT phase0
          python3 harness/experiments/dip70_wc6x/materialize.py INVERT INVERT phase0
          for arm in DIRECT INVERT; do
            git -C "$arm" config user.name "EvoNOMOS WC6-X"
            git -C "$arm" config user.email "wc6x@invalid.local"
            cd "$arm/indexer"
            npm ci --no-audit --no-fund
            npm run build
            node --require ts-node/register --test src/correlation.contract.test.ts
            npm test
            cd ../..
            echo "${arm}_PHASE0_NATIVE=PASS"
          done

      - name: Seal phase 0 metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,pathlib
          base='9f056cd3e340361947d3bb5e7b63ae2edf47b445'
          out={}
          for arm in ['DIRECT','INVERT']:
              p=subprocess.run(['git','-C',arm,'diff','--numstat',base,'--','indexer/src/api.ts','indexer/src/correlation.ts'],text=True,capture_output=True,check=True).stdout.strip().splitlines()
              rows=[]
              for line in p:
                  if not line: continue
                  a,d,path=line.split('\t')
                  rows.append((int(a),int(d),path))
              out[arm]={'F0':len(rows),'C0':sum(a+d for a,d,_ in rows),'rows':rows}
              subprocess.run(['git','-C',arm,'add','indexer/src/api.ts','indexer/src/correlation.ts','indexer/src/correlation.contract.test.ts'],check=True)
              subprocess.run(['git','-C',arm,'commit','-q','-m','WC6-X phase0 sealed'],check=True)
              out[arm]['phase0_commit']=subprocess.check_output(['git','-C',arm,'rev-parse','HEAD'],text=True).strip()
          pathlib.Path('phase0.json').write_text(json.dumps(out,indent=2))
          print('PHASE0_METRICS='+json.dumps(out,sort_keys=True))
          PY

      - name: Apply prospective phase 1 maintenance perturbation
        shell: bash
        run: |
          set -euo pipefail
          echo "PHASE1_DEMAND=accept valid x-request-id as fallback client alias; keep x-correlation-id canonical response header"
          python3 harness/experiments/dip70_wc6x/materialize.py DIRECT DIRECT phase1
          python3 harness/experiments/dip70_wc6x/materialize.py INVERT INVERT phase1
          for arm in DIRECT INVERT; do
            cd "$arm/indexer"
            npm run build
            node --require ts-node/register --test src/correlation.contract.test.ts
            npm test
            cd ../..
            echo "${arm}_PHASE1_NATIVE=PASS"
          done

      - name: Compute lifecycle vectors and ordering geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,pathlib
          p0=json.loads(pathlib.Path('phase0.json').read_text())
          vectors={}
          for arm in ['DIRECT','INVERT']:
              c0=p0[arm]['phase0_commit']
              s=subprocess.run(['git','-C',arm,'diff','--numstat',c0,'--','indexer/src/api.ts','indexer/src/correlation.ts'],text=True,capture_output=True,check=True).stdout.strip().splitlines()
              rows=[]
              for line in s:
                  if not line: continue
                  a,d,path=line.split('\t')
                  rows.append((int(a),int(d),path))
              vectors[arm]=[p0[arm]['F0'],p0[arm]['C0'],len(rows),sum(a+d for a,d,_ in rows),1]
          D=vectors['DIRECT']; I=vectors['INVERT']; delta=[i-d for d,i in zip(D,I)]
          if all(x>=0 for x in delta) and any(x>0 for x in delta): g='PARETO_DIRECT'
          elif all(x<=0 for x in delta) and any(x<0 for x in delta): g='PARETO_INVERT'
          elif all(x==0 for x in delta): g='TIE'
          else: g='TRADEOFF'
          result={'base':'9f056cd3e340361947d3bb5e7b63ae2edf47b445','demand':'CIRCLEUP-AJO/CIRCLEUP#369','phase1':'x-request-id fallback alias','vectors':vectors,'delta_I_minus_D':delta,'geometry':g,'functional_oracle':'PASS_BOTH','baseline_native':'PASS','P1':'phase1 native build+issue-derived contract pass indicator'}
          pathlib.Path('wc6x_result.json').write_text(json.dumps(result,indent=2))
          print('WC6X_RESULT='+json.dumps(result,sort_keys=True))
          PY
